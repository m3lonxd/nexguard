{% extends "base.html" %}
{% block title %}{{ mod.title }} - NexGuard{% endblock %}
{% block content %}
<h1>{{ mod.title }}</h1>
<p class="muted">{{ mod.description }}</p>
<div class="card">
{% if data %}<dl>{% for k, v in data.items() %}<dt>{{ k }}</dt><dd>{{ v }}</dd>{% endfor %}</dl>
{% else %}<p class="muted">Veri yok.</p>{% endif %}
</div>
{% endblock %}
