<svg id="worldmap" viewBox="0 10 {{ world.w }} 400" role="img" aria-label="Dünya haritası: bağlantı kaynakları" preserveAspectRatio="xMidYMid meet">
  <g class="land">{% for cc, d in world.paths.items() %}{% if cc != 'AQ' %}<path id="c-{{ cc }}" data-cc="{{ cc }}" d="{{ d }}"/>{% endif %}{% endfor %}</g>
  <g id="dots"></g>
</svg>
<div class="map-legend"><span>Az</span><i class="lg l1"></i><i class="lg l2"></i><i class="lg l3"></i><i class="lg l4"></i><span>Çok bağlantı</span></div>
<div id="map-tip" class="map-tip" hidden></div>
