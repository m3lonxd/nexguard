{% extends "base.html" %}
{% block title %}Giriş - NexGuard{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>NexGuard</h1>
  <p class="muted">Sunucu güvenlik paneli</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Kullanıcı adı <input name="username" autocomplete="username" required autofocus></label>
    <label>Parola <input name="password" type="password" autocomplete="current-password" required></label>
    <label>Doğrulama kodu <small class="muted">(2FA açıksa)</small>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
    <button>Giriş yap</button>
  </form>
</section>
{% endblock %}
