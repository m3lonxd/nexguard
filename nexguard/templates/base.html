<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}NexGuard{% endblock %}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#content">İçeriğe geç</a>
{% if user %}
<header class="top">
  <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v5.5c0 4.7-3.4 8-8 9.5-4.6-1.5-8-4.8-8-9.5V6l8-3z"/></svg> NexGuard</a>
  <nav class="nav" aria-label="Ana gezinme">
    <a href="/" {% if page == 'overview' %}class="on" aria-current="page"{% endif %}>Genel Bakış</a>
    {% for m in modules %}<a href="/m/{{ m.slug }}" {% if page == m.slug %}class="on" aria-current="page"{% endif %}>{{ m.title }}</a>
    {% endfor %}<a href="/settings" {% if page == 'settings' %}class="on" aria-current="page"{% endif %}>Ayarlar</a>
  </nav>
  <div class="user">
    <span>{{ user }}</span>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="icon">Çıkış</button></form>
  </div>
</header>
{% endif %}
<main id="content" class="{{ ('main-flush' if flush else 'main') if user else 'auth' }}">
  {% if flash %}<p class="flash" role="status">{{ flash }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
{% if user %}<footer class="site">NexGuard {{ version }} · yerel panel · veri bu makineden çıkmaz</footer>{% endif %}
<script src="/static/site.js" defer></script>
</body>
</html>
